<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Travel Registration</title>
<style>
body{font-family:Arial,sans-serif;background:#f3f5f7;margin:0;padding:20px;color:#1f2937}
.card{max-width:560px;margin:auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 20px #0001}
h1{margin-top:0} label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ccd3da;border-radius:9px;font-size:15px}
button{margin-top:20px;width:100%;padding:13px;border:0;border-radius:9px;background:#111827;color:white;font-size:16px}
.note{font-size:13px;color:#667085}
</style>
</head>
<body>
<div class="card">
<h1>Travel Registration</h1>
<p class="note">This form collects preliminary travel information. It is not an official government or embassy visa application.</p>
<form action="https://formsubmit.co/brightbella3@gmail.com" method="POST">
<input type="hidden" name="_subject" value="New Travel Registration">
<input type="hidden" name="_captcha" value="false">
<label>Full name *</label><input name="Full name" required>
<label>Current country / location *</label><input name="Location" required>
<label>Destination country *</label><input name="Destination" required>
<label>Visa type *</label>
<select name="Visa type" required>
<option value="">Select one</option><option>Tourist</option><option>Business</option><option>Student</option><option>Work</option><option>Transit</option><option>Other</option>
</select>
<label>Purpose of travel</label><textarea name="Purpose" rows="3"></textarea>
<label>Occupation / work</label><input name="Occupation">
<label>Phone number</label><input name="Phone">
<label>Email</label><input type="email" name="Email">
<label>Preferred travel date</label><input type="date" name="Travel date">
<label>Additional information</label><textarea name="Additional information" rows="3"></textarea>
<button type="submit">Submit Registration</button>
</form>
</div>
</body>
</html>
